<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ellie">
<meta name="theme-color" content="#bff0e8">
<title>Ellie's Bamboo Flight</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;font-family:'Fredoka',sans-serif;}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#e8d4b8;
    background-image:radial-gradient(circle at 30% 20%,#f3e0c4,#d6bd9a);
  }
  #wrap{
    position:relative;
    width:min(100vw,480px);
    height:min(100vh,800px);
    box-shadow:0 30px 60px rgba(90,60,40,.35);
    border-radius:18px;overflow:hidden;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    text-align:center;padding:24px;z-index:5;
    background:rgba(70,50,40,.18);backdrop-filter:blur(2px);
  }
  .hidden{display:none!important;}
  .title{
    font-family:'Baloo 2',cursive;font-weight:800;
    font-size:clamp(34px,9vw,52px);color:#fff;line-height:1;
    text-shadow:0 4px 0 #e89b4f,0 7px 14px rgba(0,0,0,.25);
  }
  .title small{display:block;font-size:.42em;font-weight:700;color:#fff6e6;margin-top:8px;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.2);}
  .panel{
    background:rgba(255,251,243,.92);border-radius:22px;
    padding:22px 26px;box-shadow:0 10px 0 rgba(0,0,0,.08);
    color:#4a3b3b;max-width:310px;
  }
  .panel p{font-size:15px;line-height:1.5;font-weight:500;}
  .emoji{font-size:42px;}
  .score-big{font-family:'Baloo 2';font-weight:800;font-size:54px;color:#e8843f;line-height:1;}
  .best{font-weight:600;color:#8a7a6a;font-size:15px;margin-top:4px;}
  button{
    font-family:'Baloo 2',cursive;font-weight:800;font-size:22px;
    color:#fff;background:#f2994a;border:none;cursor:pointer;
    padding:14px 40px;border-radius:50px;
    box-shadow:0 6px 0 #c9742f,0 10px 18px rgba(0,0,0,.2);
    transition:transform .08s,box-shadow .08s;
  }
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #c9742f;}
  .hint{color:#fff;font-weight:600;font-size:16px;text-shadow:0 2px 4px rgba(0,0,0,.25);animation:bob 1.3s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  #hud{
    position:absolute;top:18px;left:0;right:0;text-align:center;
    z-index:3;pointer-events:none;
    font-family:'Baloo 2';font-weight:800;font-size:46px;color:#fff;
    text-shadow:0 3px 0 #d98b3e,0 5px 10px rgba(0,0,0,.3);
  }
  #muteBtn{
    position:absolute;top:14px;right:14px;z-index:6;
    width:44px;height:44px;padding:0;border:none;cursor:pointer;
    font-size:22px;line-height:44px;border-radius:50%;
    background:rgba(255,251,243,.85);color:#4a3b3b;
    box-shadow:0 4px 0 rgba(0,0,0,.12);
  }
  #muteBtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12);}
  #pauseBtn{
    position:absolute;top:14px;left:14px;z-index:6;
    width:44px;height:44px;padding:0;border:none;cursor:pointer;
    font-size:20px;line-height:44px;border-radius:50%;
    background:rgba(255,251,243,.85);color:#4a3b3b;
    box-shadow:0 4px 0 rgba(0,0,0,.12);
  }
  #pauseBtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12);}
  .menu-btns{display:flex;flex-direction:column;gap:12px;width:min(80%,260px);}
  .menu-btns button{width:100%;font-size:20px;padding:13px 20px;}
  button.secondary{background:#7b86c9;box-shadow:0 6px 0 #535d96,0 10px 18px rgba(0,0,0,.2);}
  button.secondary:active{box-shadow:0 2px 0 #535d96;}
  button.ghostbtn{background:rgba(255,255,255,.9);color:#5a5570;box-shadow:0 5px 0 rgba(0,0,0,.12);}
  .char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(92%,330px);}
  .char-card{
    background:rgba(255,251,243,.95);border:3px solid transparent;border-radius:16px;
    padding:10px 6px;cursor:pointer;text-align:center;color:#4a3b3b;font-weight:600;
    box-shadow:0 5px 0 rgba(0,0,0,.08);transition:transform .08s;
  }
  .char-card .ce{font-size:34px;line-height:1;}
  .char-card .cn{font-size:13px;margin-top:5px;}
  .char-card .ct{font-size:10px;color:#8a7a6a;margin-top:2px;}
  .char-card.sel{border-color:#f2994a;}
  .char-card:active{transform:scale(.95);}
  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;font-weight:600;color:#4a3b3b;}
  .seg{display:flex;border-radius:30px;overflow:hidden;border:2px solid #e0cba8;}
  .seg button{font-size:13px;padding:7px 12px;border-radius:0;background:rgba(255,255,255,.7);color:#7a6a55;box-shadow:none;font-family:'Fredoka',sans-serif;font-weight:600;}
  .seg button.on{background:#f2994a;color:#fff;}
  .toggle{font-size:14px;padding:8px 16px;border-radius:30px;background:#cdb78f;box-shadow:none;}
  .toggle.on{background:#6abf57;}
  .scores-list{list-style:none;text-align:left;width:min(86%,300px);color:#4a3b3b;}
  .scores-list li{display:flex;justify-content:space-between;padding:7px 10px;border-radius:10px;font-weight:600;}
  .scores-list li:nth-child(odd){background:rgba(255,251,243,.6);}
  .scores-list .rank{color:#e8843f;font-weight:800;margin-right:8px;}
  .menu-title{font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(26px,6vw,36px);color:#fff;text-shadow:0 3px 0 #e89b4f,0 6px 10px rgba(0,0,0,.2);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">0</div>
  <button id="muteBtn" aria-label="toggle sound">🔊</button>
  <button id="pauseBtn" class="hidden" aria-label="pause">⏸</button>

  <!-- MAIN MENU -->
  <div id="menuScreen" class="overlay">
    <div class="title">Ellie's<br>Bamboo Flight<small>🎋 a cute flappy adventure 🎋</small></div>
    <div class="menu-btns">
      <button id="mNew">New Game</button>
      <button id="mResume" class="secondary hidden">Resume</button>
      <button id="mChar" class="ghostbtn">Character</button>
      <button id="mScores" class="ghostbtn">Top Scores</button>
      <button id="mSettings" class="ghostbtn">Settings</button>
    </div>
  </div>

  <!-- CHARACTER SELECT -->
  <div id="charScreen" class="overlay hidden">
    <div class="menu-title">Choose a Flyer</div>
    <div class="char-grid" id="charGrid"></div>
    <button id="charBack" class="ghostbtn" style="margin-top:6px">Back</button>
  </div>

  <!-- SETTINGS -->
  <div id="settingsScreen" class="overlay hidden">
    <div class="menu-title">Settings</div>
    <div class="panel" style="max-width:300px">
      <div class="setting-row"><span>Sound effects</span><button id="setSfx" class="toggle on">On</button></div>
      <div class="setting-row"><span>Music</span><button id="setMusic" class="toggle on">On</button></div>
      <div class="setting-row"><span>Difficulty</span>
        <span class="seg" id="setDiff">
          <button data-d="easy">Easy</button>
          <button data-d="normal" class="on">Normal</button>
          <button data-d="hard">Hard</button>
        </span>
      </div>
    </div>
    <button id="setBack" class="ghostbtn">Back</button>
  </div>

  <!-- TOP SCORES -->
  <div id="scoresScreen" class="overlay hidden">
    <div class="menu-title">Top Scores</div>
    <ol class="scores-list" id="scoresList"></ol>
    <button id="scoresBack" class="ghostbtn">Back</button>
  </div>

  <!-- PAUSE -->
  <div id="pauseScreen" class="overlay hidden">
    <div class="menu-title">Paused</div>
    <div class="menu-btns">
      <button id="pResume">Resume</button>
      <button id="pRestart" class="secondary">Restart</button>
      <button id="pMenu" class="ghostbtn">Main Menu</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="overScreen" class="overlay hidden">
    <div class="title" style="font-size:clamp(30px,7vw,42px)">Oops! 💫</div>
    <div class="panel">
      <div class="score-big" id="finalScore">0</div>
      <div class="best" id="bestScore">Best: 0</div>
    </div>
    <div class="menu-btns">
      <button id="retryBtn">Try Again</button>
      <button id="overMenu" class="ghostbtn">Main Menu</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const wrap = document.getElementById('wrap');
  const hud = document.getElementById('hud');
  const overScreen = document.getElementById('overScreen');
  const retryBtn = document.getElementById('retryBtn');
  const finalScore = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const muteBtn = document.getElementById('muteBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const $ = id => document.getElementById(id);
  const screens = {
    menu: $('menuScreen'), char: $('charScreen'), settings: $('settingsScreen'),
    scores: $('scoresScreen'), pause: $('pauseScreen'), over: overScreen
  };
  function showScreen(name){
    Object.values(screens).forEach(s=>s.classList.add('hidden'));
    if(name && screens[name]) screens[name].classList.remove('hidden');
  }

  // ===================== AUDIO ENGINE (procedural, no files) =====================
  const Audio = (() => {
    let actx = null, master = null, musicGain = null, sfxGain = null;
    let muted = false, started = false, musicTimer = null, step = 0;
    let sfxOn = true, musicOn = true;

    function ensure(){
      if(actx) return;
      try{
        actx = new (window.AudioContext || window.webkitAudioContext)();
        master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination);
        musicGain = actx.createGain(); musicGain.gain.value = 0.18; musicGain.connect(master);
        sfxGain = actx.createGain(); sfxGain.gain.value = 0.6; sfxGain.connect(master);
      }catch(e){ actx = null; }
    }
    function resume(){ ensure(); if(actx && actx.state === 'suspended') actx.resume(); }

    // generic short tone with envelope
    function tone(freq, dur, type='sine', vol=0.5, dest=null, glideTo=null){
      if(!actx || muted) return;
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, actx.currentTime + dur);
      const t = actx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || sfxGain);
      o.start(t); o.stop(t + dur + 0.02);
    }
    // filtered noise burst (for crashes / wing whoosh)
    function noise(dur, vol=0.4, freq=1200, q=1){
      if(!actx || muted) return;
      const n = Math.floor(actx.sampleRate * dur);
      const buf = actx.createBuffer(1, n, actx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
      const src = actx.createBufferSource(); src.buffer = buf;
      const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=q;
      const g = actx.createGain(); g.gain.value = vol;
      src.connect(bp); bp.connect(g); g.connect(sfxGain);
      src.start();
    }

    // ---- named sound effects ----
    const sfx = {
      flap(){ noise(0.12, 0.18, 700, 0.8); tone(420, 0.1, 'sine', 0.12, null, 620); },
      score(){ tone(880, 0.13, 'triangle', 0.4, null, 1320); },
      bamboo(){ tone(300, 0.14, 'square', 0.18); tone(150, 0.16, 'sine', 0.2); }, // woody knock
      ladybugs(){ tone(1200, 0.08,'sine',0.22,null,1700); setTimeout(()=>tone(1500,0.07,'sine',0.18,null,1900),60); }, // chirp
      ants(){ for(let i=0;i<3;i++) setTimeout(()=>tone(2200,0.03,'square',0.10),i*45); }, // tiny ticks
      spider(){ tone(200, 0.25,'sawtooth',0.18,null,90); }, // web twang
      hit(){ noise(0.3, 0.5, 240, 0.6); tone(180,0.3,'square',0.3,null,70); }
    };

    // ---- gentle looping background music (pentatonic, soft) ----
    const melody = [0,3,5,7,10,7,5,3, 0,5,7,10,12,10,7,5];
    const root = 196; // G3
    function scaleFreq(semi){ return root * Math.pow(2, semi/12); }
    function tick(){
      if(actx && !muted && started){
        const n = melody[step % melody.length];
        // soft lead
        tone(scaleFreq(n)*2, 0.5, 'triangle', 0.16, musicGain, scaleFreq(n)*2);
        // soft bass every other beat
        if(step % 2 === 0) tone(scaleFreq(n)/2, 0.7, 'sine', 0.22, musicGain);
        step++;
      }
    }
    function startMusic(){
      if(musicTimer) return;
      tick();
      musicTimer = setInterval(tick, 420);
    }
    function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer = null; } }

    return {
      unlock(){ resume(); if(!started){ started = true; if(!muted && musicOn) startMusic(); } },
      play(name){ if(!sfxOn) return; resume(); if(sfx[name]) sfx[name](); },
      setSfx(on){ sfxOn=on; },
      setMusic(on){ musicOn=on; if(!on) stopMusic(); else if(started && !muted) startMusic(); },
      toggleMute(){
        muted = !muted;
        if(muted){ stopMusic(); }
        else { resume(); if(started && musicOn) startMusic(); }
        return muted;
      },
      get muted(){ return muted; }
    };
  })();

  muteBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const m = Audio.toggleMute();
    muteBtn.textContent = m ? '🔇' : '🔊';
  });

  // When the page is backgrounded on iOS (call, notification, app switch) rAF pauses.
  // On return, reset the clock so the accumulator doesn't try to "catch up" with a
  // burst of steps that would jolt Ellie. Also drop any leftover simulation time.
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden){ lastT = performance.now(); acc = 0; }
  });

  let W, H, DPR, GROUND_H;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = wrap.getBoundingClientRect();
    W = r.width; H = r.height;
    GROUND_H = Math.max(64, H*0.09);
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- tuning (all in px/sec so motion is framerate-independent) ----
  const GRAV   = 1500;     // px/s^2
  const FLAP   = -430;     // px/s impulse
  const PIPE_W = 72;
  let   GAP    = 195;      // gap height (set by difficulty)
  const SPACING= 250;      // horizontal distance between obstacles
  let   BASE_SPEED = 150;  // px/s scroll speed (set by difficulty)

  let state = 'menu';      // menu | playing | paused | over
  let best = 0;
  let score, time, ellie, ghost, obstacles, speed, pickups, powers;
  let scenery; // parallax background layers

  // ===================== PERSISTENT STORAGE (safe) =====================
  const Store = {
    get(key, def){
      try{ const v=localStorage.getItem('ebf_'+key); return v==null?def:JSON.parse(v); }
      catch(e){ return (this._mem&&this._mem[key]!=null)?this._mem[key]:def; }
    },
    set(key, val){
      try{ localStorage.setItem('ebf_'+key, JSON.stringify(val)); }
      catch(e){ (this._mem=this._mem||{})[key]=val; }
    },
    _mem:{}
  };

  // ===================== CHARACTERS =====================
  // carried:true -> ghost holds it on a string (pendulum). carried:false -> it flies itself.
  const CHARACTERS = {
    elephant:{ name:'Ellie',  emoji:'🐘', tag:'carried by ghost', carried:true,  draw:'elephant' },
    teddy:   { name:'Teddy',  emoji:'🧸', tag:'carried by ghost', carried:true,  draw:'teddy' },
    hen:     { name:'Hen',    emoji:'🐔', tag:'heavy flyer',       carried:false, draw:'hen',    flap:-410, grav:1700 },
    pigeon:  { name:'Pigeon', emoji:'🕊️', tag:'steady flyer',      carried:false, draw:'pigeon', flap:-430, grav:1500 },
    eagle:   { name:'Eagle',  emoji:'🦅', tag:'floaty & fast',     carried:false, draw:'eagle',  flap:-440, grav:1250 }
  };
  let charKey = Store.get('char','elephant');

  // ===================== SETTINGS =====================
  const DIFF = {
    easy:  { gap:235, speed:130 },
    normal:{ gap:195, speed:150 },
    hard:  { gap:165, speed:178 }
  };
  let settings = Store.get('settings', { sfx:true, music:true, diff:'normal' });
  function applyDifficulty(){
    const d=DIFF[settings.diff]||DIFF.normal;
    GAP=d.gap; BASE_SPEED=d.speed;
  }
  applyDifficulty();
  Audio.setSfx(settings.sfx);
  Audio.setMusic(settings.music);

  // ===================== SCENERY (parallax background) =====================
  // layer: 0 = far buildings, 1 = hills/trees, 2 = water strip near ground
  function makeScenery(){
    scenery = { buildings:[], trees:[], hills:[], water: H - GROUND_H - 26, items:[] };
    // pre-fill far buildings & trees across and beyond the screen
    let bx = 0;
    while(bx < W + 200){
      const t = Math.random();
      if(t < 0.5){
        scenery.items.push(makeBuilding(bx));
        bx += 60 + Math.random()*50;
      } else {
        scenery.items.push(makeTree(bx));
        bx += 70 + Math.random()*60;
      }
    }
  }
  function makeBuilding(x){
    const h = 70 + Math.random()*120;
    const w = 34 + Math.random()*30;
    const hue = ['#b9c7d6','#c7d2de','#aebccb','#cfd8e2'][Math.floor(Math.random()*4)];
    return {kind:'building', x, w, h, hue, layer:0, win: Math.random()<0.7};
  }
  function makeTree(x){
    const h = 54 + Math.random()*46;
    return {kind:'tree', x, h, layer:1, tint: Math.random()<0.5?'#7fbf6a':'#6fb35c'};
  }
  function recycleScenery(dt){
    const horizon = H - GROUND_H;
    scenery.items.forEach(it=>{
      const par = it.layer===0 ? 0.25 : 0.5;
      it.x -= speed * par * dt;
    });
    // remove off-screen left, append new on the right
    scenery.items = scenery.items.filter(it=> it.x + 120 > 0);
    let rightMost = 0;
    scenery.items.forEach(it=> rightMost = Math.max(rightMost, it.x));
    while(rightMost < W + 160){
      const t = Math.random();
      if(t < 0.5){ const b = makeBuilding(rightMost + 50 + Math.random()*40); scenery.items.push(b); rightMost = b.x; }
      else { const tr = makeTree(rightMost + 60 + Math.random()*50); scenery.items.push(tr); rightMost = tr.x; }
    }
  }

  // ===================== OBSTACLES =====================
  // types: 'bamboo' | 'spider' | 'ladybugs' | 'ants'
  function addObstacle(x){
    const margin = 86;
    const gapY = margin + Math.random()*(H - GAP - margin*2 - GROUND_H);
    const roll = Math.random();
    let type;
    if(roll < 0.42) type = 'bamboo';
    else if(roll < 0.62) type = 'spider';
    else if(roll < 0.81) type = 'ladybugs';
    else type = 'ants';

    const o = { x, gapY, type, scored:false };

    if(type === 'spider'){
      // Top & bottom are tree branches (drawn separately). A spider hangs on a
      // web from the upper branch and swings SIDE TO SIDE across the gap, so the
      // vertical opening always stays clear — you fly through when the spider has
      // swung to one side. Web length is fixed; only the horizontal sway changes.
      const anchorY = gapY;                 // web attaches to underside of top branch
      const hangLen = GAP*0.34;             // spider sits high -> big clear space below
      const swing = (PIPE_W*0.5) + 26;      // horizontal swing amplitude (px)
      o.spider = {
        r: 13,
        anchorY,
        hangLen,
        swing,
        phase: Math.random()*6.28,
        freq: 0.55 + Math.random()*0.3,     // swings/sec
        sx: 0,                              // current horizontal offset (set each frame)
        sy: gapY + hangLen                  // fixed vertical position
      };
    } else if(type === 'ladybugs'){
      // ladybug clusters that FILL the top and bottom barriers (visual matches collision)
      o.bugs = [];
      const step = 28;
      for(let y = 14; y < gapY - 6; y += step){
        o.bugs.push({ x:(Math.random()*PIPE_W-PIPE_W/2)*0.55, y, ph:Math.random()*6.28, r:14 });
      }
      o.botBugs = [];
      const botStart = gapY + GAP;
      const botEnd = H - GROUND_H;
      for(let y = botStart + 14; y < botEnd - 6; y += step){
        o.botBugs.push({ x:(Math.random()*PIPE_W-PIPE_W/2)*0.55, y, ph:Math.random()*6.28, r:14 });
      }
    } else if(type === 'ants'){
      // marching ant columns top & bottom (the solid parts), animated legs
      o.antPhase = Math.random()*6.28;
    }
    obstacles.push(o);
  }

  // ===================== LIFECYCLE =====================
  function reset(){
    score = 0; time = 0; speed = BASE_SPEED;
    applyDifficulty();
    const ch = CHARACTERS[charKey];
    if(ch.carried){
      // ghost carries the character on a string (pendulum)
      ghost = { x: W*0.30, y: H*0.40, vy: 0, flap: 0 };
      const L = 92;
      ellie = { r:22, baseR:22, string:L, a:0, av:0, x:ghost.x, y:ghost.y+L, rot:0, carried:true };
    } else {
      // the character flies itself (classic flap)
      ghost = null;
      ellie = { r:22, baseR:22, x:W*0.30, y:H*0.45, vy:0, rot:0, flap:0, carried:false };
    }
    obstacles = [];
    pickups = [];
    powers = { invincible:0, tiny:0, slowmo:0, shield:false };
    makeScenery();
    let startX = W + 140;
    for(let i=0;i<4;i++) addObstacle(startX + i*SPACING);
    hud.textContent = '0';
  }
  // ---- power-up pickups ----
  const POWER_TYPES = ['invincible','tiny','slowmo','shield'];
  const POWER_INFO = {
    invincible:{ color:'#ffd34d', ring:'#e8a400', icon:'star' },
    tiny:{ color:'#7fd1ff', ring:'#2f9fe0', icon:'arrows' },
    slowmo:{ color:'#b59cff', ring:'#7c5fe0', icon:'clock' },
    shield:{ color:'#9be88a', ring:'#4faf3f', icon:'shield' }
  };
  function maybeSpawnPickup(afterX){
    // ~40% chance to float a pickup midway after a newly added obstacle
    if(Math.random() > 0.4) return;
    const type = POWER_TYPES[Math.floor(Math.random()*POWER_TYPES.length)];
    const x = afterX + SPACING*0.5;
    const y = 110 + Math.random()*(H - GROUND_H - 220);
    pickups.push({ x, y, r:16, type, phase:Math.random()*6.28, taken:false });
  }

  function applyPower(type){
    if(type==='invincible') powers.invincible = 3;
    else if(type==='tiny')  powers.tiny = 3;
    else if(type==='slowmo') powers.slowmo = 3;
    else if(type==='shield') powers.shield = true;
  }

  function flap(){
    if(state !== 'playing') return;
    const ch=CHARACTERS[charKey];
    if(ch.carried){ ghost.vy = FLAP; ghost.flap = 1; }
    else { ellie.vy = (ch.flap||FLAP); ellie.flap = 1; }
    Audio.play('flap');
  }
  function startGame(){
    Audio.unlock();
    reset(); state='playing';
    showScreen(null);
    hud.classList.remove('hidden');
    pauseBtn.classList.remove('hidden');
  }
  function pauseGame(){
    if(state!=='playing') return;
    state='paused';
    pauseBtn.classList.add('hidden');
    showScreen('pause');
  }
  function resumeGame(){
    if(state!=='paused') return;
    state='playing';
    lastT = performance.now(); acc = 0;   // avoid a physics jump after pause
    showScreen(null);
    pauseBtn.classList.remove('hidden');
  }
  function toMenu(keepPaused){
    if(keepPaused && state==='paused'){
      // keep the run alive in the background; menu's Resume will continue it
    } else {
      state='menu';
    }
    pauseBtn.classList.add('hidden');
    hud.classList.add('hidden');
    refreshMenu();
    showScreen('menu');
  }
  function gameOver(){
    Audio.play('hit');
    state='over';
    const key='best_'+charKey;
    best=Math.max(Store.get(key,0), score);
    Store.set(key, best);
    recordScore(score);
    finalScore.textContent = score;
    bestScoreEl.textContent = 'Best ('+CHARACTERS[charKey].name+'): '+best;
    hud.classList.add('hidden');
    pauseBtn.classList.add('hidden');
    showScreen('over');
  }

  // ---- top scores (per device) ----
  function recordScore(s){
    if(s<=0) return;
    let list=Store.get('scores',[]);
    list.push({ s, c:charKey, t:Date.now() });
    list.sort((a,b)=>b.s-a.s);
    list=list.slice(0,8);
    Store.set('scores', list);
  }
  function renderScores(){
    const list=Store.get('scores',[]);
    const el=$('scoresList');
    if(!list.length){ el.innerHTML='<li><span>No scores yet — go fly!</span></li>'; return; }
    el.innerHTML = list.map((r,i)=>{
      const ch=CHARACTERS[r.c]||{emoji:'❓',name:'?'};
      return '<li><span><span class="rank">'+(i+1)+'</span>'+ch.emoji+' '+ch.name+'</span><b>'+r.s+'</b></li>';
    }).join('');
  }

  // ---- input ----
  function press(e){
    // tapping the canvas only flaps during play; menus use their own buttons
    if(state==='playing'){ e.preventDefault(); flap(); }
  }
  cv.addEventListener('pointerdown', press);
  window.addEventListener('keydown', e=>{
    if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); if(state==='playing') flap(); }
    if(e.code==='Escape'){ if(state==='playing') pauseGame(); else if(state==='paused') resumeGame(); }
  });

  // menu buttons
  $('mNew').addEventListener('click', e=>{ e.stopPropagation(); startGame(); });
  $('mResume').addEventListener('click', e=>{ e.stopPropagation(); resumeGame(); });
  $('mChar').addEventListener('click', e=>{ e.stopPropagation(); renderCharGrid(); showScreen('char'); });
  $('mScores').addEventListener('click', e=>{ e.stopPropagation(); renderScores(); showScreen('scores'); });
  $('mSettings').addEventListener('click', e=>{ e.stopPropagation(); renderSettings(); showScreen('settings'); });
  $('charBack').addEventListener('click', e=>{ e.stopPropagation(); showScreen('menu'); });
  $('scoresBack').addEventListener('click', e=>{ e.stopPropagation(); showScreen('menu'); });
  $('setBack').addEventListener('click', e=>{ e.stopPropagation(); showScreen('menu'); });

  // pause / over buttons
  pauseBtn.addEventListener('click', e=>{ e.stopPropagation(); pauseGame(); });
  $('pResume').addEventListener('click', e=>{ e.stopPropagation(); resumeGame(); });
  $('pRestart').addEventListener('click', e=>{ e.stopPropagation(); startGame(); });
  $('pMenu').addEventListener('click', e=>{ e.stopPropagation(); toMenu(true); });
  retryBtn.addEventListener('click', e=>{ e.stopPropagation(); startGame(); });
  $('overMenu').addEventListener('click', e=>{ e.stopPropagation(); state='over'; toMenu(false); });

  // character grid
  function renderCharGrid(){
    const grid=$('charGrid');
    grid.innerHTML = Object.entries(CHARACTERS).map(([k,c])=>
      '<div class="char-card'+(k===charKey?' sel':'')+'" data-k="'+k+'">'+
      '<div class="ce">'+c.emoji+'</div><div class="cn">'+c.name+'</div><div class="ct">'+c.tag+'</div></div>'
    ).join('');
    grid.querySelectorAll('.char-card').forEach(card=>{
      card.addEventListener('click', e=>{
        e.stopPropagation();
        charKey=card.dataset.k; Store.set('char',charKey);
        renderCharGrid();
      });
    });
  }

  // settings
  function renderSettings(){
    $('setSfx').className='toggle'+(settings.sfx?' on':''); $('setSfx').textContent=settings.sfx?'On':'Off';
    $('setMusic').className='toggle'+(settings.music?' on':''); $('setMusic').textContent=settings.music?'On':'Off';
    $('setDiff').querySelectorAll('button').forEach(b=> b.className=(b.dataset.d===settings.diff?'on':''));
  }
  $('setSfx').addEventListener('click', e=>{ e.stopPropagation(); settings.sfx=!settings.sfx; Store.set('settings',settings); Audio.setSfx(settings.sfx); renderSettings(); });
  $('setMusic').addEventListener('click', e=>{ e.stopPropagation(); settings.music=!settings.music; Store.set('settings',settings); Audio.setMusic(settings.music); renderSettings(); });
  $('setDiff').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', e=>{ e.stopPropagation(); settings.diff=b.dataset.d; Store.set('settings',settings); applyDifficulty(); renderSettings(); });
  });

  function refreshMenu(){
    // show Resume only when a game is paused
    $('mResume').classList.toggle('hidden', state!=='paused');
  }

  // ===================== DRAW HELPERS =====================
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawBackground(){
    const horizon = H - GROUND_H;
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#bdeee6'); g.addColorStop(.5,'#d9f0d6'); g.addColorStop(1,'#fbe7cc');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // sun glow
    ctx.fillStyle='rgba(255,240,190,.6)';
    ctx.beginPath(); ctx.arc(W*0.8,H*0.15,70,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,232,170,.9)';
    ctx.beginPath(); ctx.arc(W*0.8,H*0.15,44,0,7); ctx.fill();

    // far parallax items (buildings behind, trees in front of them)
    scenery.items.filter(it=>it.layer===0).forEach(it=> drawBuilding(it, horizon));
    // rolling hill band
    ctx.fillStyle='#bfe3a8';
    ctx.beginPath();
    ctx.moveTo(0,horizon);
    const hillH = 46;
    for(let x=0;x<=W;x+=40){
      const y = horizon - hillH*0.5 - Math.sin((x+time*30)/120)*hillH*0.4;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,horizon); ctx.closePath(); ctx.fill();
    scenery.items.filter(it=>it.layer===1).forEach(it=> drawTree(it, horizon));

    // water strip just above ground
    const wy = horizon - 18;
    ctx.fillStyle='rgba(120,195,225,.55)';
    ctx.fillRect(0, wy, W, 18);
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2;
    for(let x=0;x<W;x+=26){
      const off = (time*40 + x) ;
      ctx.beginPath();
      ctx.arc(x + (off%26), wy+9 + Math.sin(off/30)*2, 5, 0.15*Math.PI, 0.85*Math.PI);
      ctx.stroke();
    }
  }

  function drawBuilding(b, horizon){
    const y = horizon - b.h;
    ctx.fillStyle=b.hue;
    roundRect(b.x, y, b.w, b.h, 4); ctx.fill();
    // roof cap
    ctx.fillStyle='rgba(0,0,0,.06)';
    ctx.fillRect(b.x, y, b.w, 6);
    if(b.win){
      ctx.fillStyle='rgba(255,250,225,.8)';
      for(let wy=y+10; wy<horizon-8; wy+=16){
        for(let wx=b.x+6; wx<b.x+b.w-8; wx+=12){
          ctx.fillRect(wx,wy,6,8);
        }
      }
    }
  }
  function drawTree(t, horizon){
    const x=t.x, baseY=horizon;
    // trunk
    ctx.fillStyle='#9c7a52';
    ctx.fillRect(x-4, baseY-t.h*0.5, 8, t.h*0.5);
    // canopy (three puffs)
    ctx.fillStyle=t.tint;
    ctx.beginPath();
    ctx.arc(x, baseY - t.h*0.55, t.h*0.34, 0,7);
    ctx.arc(x - t.h*0.28, baseY - t.h*0.42, t.h*0.26, 0,7);
    ctx.arc(x + t.h*0.28, baseY - t.h*0.42, t.h*0.26, 0,7);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(x - t.h*0.1, baseY - t.h*0.62, t.h*0.16,0,7); ctx.fill();
  }

  // ----- bamboo stalk -----
  function drawBambooSeg(x, top, bottom){
    const h = bottom-top;
    const g = ctx.createLinearGradient(x,0,x+PIPE_W,0);
    g.addColorStop(0,'#a6e093'); g.addColorStop(.45,'#7cc36a'); g.addColorStop(1,'#56a047');
    ctx.fillStyle=g; roundRect(x,top,PIPE_W,h,12); ctx.fill();
    // segment nodes
    const nodeGap=58;
    for(let ny=top+30; ny<bottom-12; ny+=nodeGap){
      ctx.fillStyle='#5aa54b';
      roundRect(x-4, ny-6, PIPE_W+8, 12, 6); ctx.fill();
      ctx.strokeStyle='rgba(40,90,40,.35)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x+4,ny); ctx.lineTo(x+PIPE_W-4,ny); ctx.stroke();
    }
    // glossy highlight + soft right shade
    ctx.fillStyle='rgba(255,255,255,.30)'; roundRect(x+10,top+8,8,h-16,4); ctx.fill();
    ctx.fillStyle='rgba(40,90,40,.14)'; roundRect(x+PIPE_W-16,top+8,7,h-16,4); ctx.fill();
    // leaves at open end
    ctx.fillStyle='#67bd55';
    const ly = (top===0)? bottom : top;
    ctx.save(); ctx.translate(x+PIPE_W/2, ly);
    for(const a of [-0.7,0.0,0.7]){
      ctx.save(); ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(0,(top===0?16:-16),8,24,0,0,7); ctx.fill(); ctx.restore();
    }
    ctx.restore();
  }
  function drawBamboo(o){
    drawBambooSeg(o.x, 0, o.gapY);
    drawBambooSeg(o.x, o.gapY+GAP, H-GROUND_H);
  }

  function drawLadybug(cx, cy, r){
    ctx.save(); ctx.translate(cx,cy);
    // shadow
    ctx.fillStyle='rgba(0,0,0,.10)';
    ctx.beginPath(); ctx.ellipse(0,r*0.7,r*0.9,r*0.35,0,0,7); ctx.fill();
    // body
    ctx.fillStyle='#e0473b';
    ctx.beginPath(); ctx.ellipse(0,0,r,r*0.92,0,0,7); ctx.fill();
    // wing split
    ctx.strokeStyle='#2a2424'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,-r*0.9); ctx.lineTo(0,r*0.9); ctx.stroke();
    // head
    ctx.fillStyle='#2a2424';
    ctx.beginPath(); ctx.arc(0,-r*0.78,r*0.42,0,7); ctx.fill();
    // spots
    ctx.fillStyle='#2a2424';
    const sp=[[-0.45,-0.2],[0.45,-0.2],[-0.4,0.4],[0.4,0.4],[0,0.15]];
    sp.forEach(s=>{ ctx.beginPath(); ctx.arc(s[0]*r, s[1]*r, r*0.16,0,7); ctx.fill(); });
    // eyes
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-r*0.18,-r*0.82,r*0.12,0,7); ctx.arc(r*0.18,-r*0.82,r*0.12,0,7); ctx.fill();
    ctx.restore();
  }
  function drawLadybugs(o){
    const cx=o.x+PIPE_W/2;
    o.bugs.forEach(b=> drawLadybug(cx+b.x, b.y + Math.sin(time*2.4+b.ph)*4, b.r));
    o.botBugs.forEach(b=> drawLadybug(cx+b.x, b.y + Math.sin(time*2.4+b.ph)*4, b.r));
  }

  function drawAnt(cx, cy, r, ph){
    ctx.save(); ctx.translate(cx,cy);
    ctx.strokeStyle='#3a2a22'; ctx.fillStyle='#4a3328';
    // legs
    ctx.lineWidth=2; ctx.lineCap='round';
    const sw=Math.sin(ph)*0.25;
    for(const s of [-1,1]){
      for(let i=0;i<3;i++){
        ctx.beginPath();
        ctx.moveTo(0, -r*0.3 + i*r*0.4);
        ctx.lineTo(s*r*1.3, -r*0.3 + i*r*0.4 + sw*r*s + r*0.5);
        ctx.stroke();
      }
    }
    // 3 body segments
    ctx.beginPath(); ctx.arc(0,-r*0.9,r*0.5,0,7); ctx.fill();   // head
    ctx.beginPath(); ctx.arc(0,0,r*0.45,0,7); ctx.fill();        // thorax
    ctx.beginPath(); ctx.arc(0,r*0.95,r*0.6,0,7); ctx.fill();    // abdomen
    // antennae
    ctx.beginPath(); ctx.moveTo(-r*0.2,-r*1.2); ctx.lineTo(-r*0.6,-r*1.7);
    ctx.moveTo(r*0.2,-r*1.2); ctx.lineTo(r*0.6,-r*1.7); ctx.stroke();
    ctx.restore();
  }
  function drawAnts(o){
    // solid earthy columns top and bottom, with ants marching along the inner edge
    const grad = ctx.createLinearGradient(o.x,0,o.x+PIPE_W,0);
    grad.addColorStop(0,'#caa46f'); grad.addColorStop(.5,'#b5894f'); grad.addColorStop(1,'#9c733f');
    ctx.fillStyle=grad;
    roundRect(o.x,0,PIPE_W,o.gapY,10); ctx.fill();
    roundRect(o.x,o.gapY+GAP,PIPE_W,(H-GROUND_H)-(o.gapY+GAP),10); ctx.fill();
    // ants walking on the lip of each column
    const r=7;
    for(let i=0;i<3;i++){
      drawAnt(o.x+12+i*22, o.gapY-12, r, o.antPhase+time*8+i);
    }
    for(let i=0;i<3;i++){
      drawAnt(o.x+12+i*22, o.gapY+GAP+12, r, o.antPhase+time*8+i+1.5);
    }
  }

  function drawBranch(x, top, bottom){
    const h=bottom-top, cx=x+PIPE_W/2;
    // bark gradient
    const g=ctx.createLinearGradient(x,0,x+PIPE_W,0);
    g.addColorStop(0,'#9c7550'); g.addColorStop(.5,'#7d5a3a'); g.addColorStop(1,'#5f4329');
    ctx.fillStyle=g; roundRect(x,top,PIPE_W,h,10); ctx.fill();
    // bark texture lines
    ctx.strokeStyle='rgba(60,40,25,.35)'; ctx.lineWidth=2;
    for(let i=0;i<3;i++){
      const lx=x+12+i*22;
      ctx.beginPath(); ctx.moveTo(lx,top+6); ctx.lineTo(lx+4,bottom-6); ctx.stroke();
    }
    // a couple of leafy twigs at the open end
    const ly=(top===0)?bottom:top, dir=(top===0)?1:-1;
    ctx.strokeStyle='#6f5238'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(cx,ly); ctx.lineTo(cx-16,ly+dir*16); ctx.moveTo(cx,ly); ctx.lineTo(cx+18,ly+dir*12); ctx.stroke();
    ctx.fillStyle='#6abf57';
    for(const lp of [[-22,18],[20,14],[2,22]]){
      ctx.beginPath(); ctx.ellipse(cx+lp[0], ly+dir*lp[1], 8, 12, lp[0]*0.03, 0, 7); ctx.fill();
    }
    ctx.fillStyle='rgba(255,255,255,.12)'; roundRect(x+9,top+6,7,h-12,4); ctx.fill();
  }

  function drawSpider(o){
    // tree-branch barriers, top and bottom
    drawBranch(o.x, 0, o.gapY);
    drawBranch(o.x, o.gapY+GAP, H-GROUND_H);

    const cx = o.x + PIPE_W/2;
    const anchorX = cx;                 // web hangs from a fixed point on the branch
    const sx = cx + o.spider.sx;        // spider current x (swinging)
    const sy = o.spider.sy;             // spider y (fixed mid-gap)
    const r = o.spider.r;
    // angled web line from the branch anchor to the swinging spider
    ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(anchorX, o.spider.anchorY); ctx.lineTo(sx, sy-r+2); ctx.stroke();

    ctx.save(); ctx.translate(sx, sy);
    const legSwing=Math.sin(time*6+o.spider.phase)*0.3;
    ctx.strokeStyle='#3a2f3a'; ctx.lineWidth=2.4; ctx.lineCap='round';
    for(const side of [-1,1]){
      for(let i=0;i<4;i++){
        const ay=-6+i*5, spread=(10+i*1.5)*side;
        ctx.beginPath(); ctx.moveTo(side*7,ay);
        ctx.quadraticCurveTo(spread, ay-4+legSwing*6*side, spread*1.3, ay+7); ctx.stroke();
      }
    }
    ctx.fillStyle='#473b4a'; ctx.beginPath(); ctx.ellipse(0,6,12,13,0,0,7); ctx.fill();
    ctx.fillStyle='#6b5870'; ctx.beginPath(); ctx.ellipse(0,6,5,7,0,0,7); ctx.fill();
    ctx.fillStyle='#3a2f3a'; ctx.beginPath(); ctx.arc(0,-6,8,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-3,-7,3,0,7); ctx.arc(3,-7,3,0,7); ctx.fill();
    ctx.fillStyle='#1d1820'; ctx.beginPath(); ctx.arc(-2.6,-6.5,1.5,0,7); ctx.arc(3.4,-6.5,1.5,0,7); ctx.fill();
    ctx.restore();
  }

  function drawPickups(){
    pickups.forEach(p=>{
      if(p.taken) return;
      const info=POWER_INFO[p.type];
      const y=p.bobY!=null?p.bobY:p.y;
      ctx.save(); ctx.translate(p.x,y);
      const pulse=1+Math.sin(time*4+p.phase)*0.08;
      ctx.scale(pulse,pulse);
      ctx.fillStyle=info.color+'55';
      ctx.beginPath(); ctx.arc(0,0,p.r+8,0,7); ctx.fill();
      ctx.fillStyle=info.color;
      ctx.beginPath(); ctx.arc(0,0,p.r,0,7); ctx.fill();
      ctx.lineWidth=3; ctx.strokeStyle=info.ring;
      ctx.beginPath(); ctx.arc(0,0,p.r,0,7); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.strokeStyle='#fff'; ctx.lineWidth=2.4; ctx.lineCap='round';
      if(info.icon==='star'){
        ctx.beginPath();
        for(let i=0;i<5;i++){
          const a=-Math.PI/2 + i*2*Math.PI/5, a2=a+Math.PI/5;
          ctx.lineTo(Math.cos(a)*8, Math.sin(a)*8);
          ctx.lineTo(Math.cos(a2)*3.6, Math.sin(a2)*3.6);
        }
        ctx.closePath(); ctx.fill();
      } else if(info.icon==='clock'){
        ctx.beginPath(); ctx.arc(0,0,7,0,7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-5); ctx.moveTo(0,0); ctx.lineTo(4,1); ctx.stroke();
      } else if(info.icon==='arrows'){
        ctx.beginPath(); ctx.moveTo(-8,-8); ctx.lineTo(-2,-2); ctx.moveTo(-6,-2); ctx.lineTo(-2,-2); ctx.lineTo(-2,-6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(8,8); ctx.lineTo(2,2); ctx.moveTo(6,2); ctx.lineTo(2,2); ctx.lineTo(2,6); ctx.stroke();
      } else if(info.icon==='shield'){
        ctx.beginPath();
        ctx.moveTo(0,-8); ctx.lineTo(7,-4); ctx.lineTo(7,2); ctx.quadraticCurveTo(7,8,0,10);
        ctx.quadraticCurveTo(-7,8,-7,2); ctx.lineTo(-7,-4); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });
  }

  function drawObstacle(o){
    if(o.type==='bamboo') drawBamboo(o);
    else if(o.type==='spider') drawSpider(o);
    else if(o.type==='ladybugs') drawLadybugs(o);
    else if(o.type==='ants') drawAnts(o);
  }

  function drawGround(){
    const gy=H-GROUND_H;
    const g=ctx.createLinearGradient(0,gy,0,H);
    g.addColorStop(0,'#e3c79b'); g.addColorStop(1,'#d4b582');
    ctx.fillStyle=g; ctx.fillRect(0,gy,W,GROUND_H);
    ctx.fillStyle='#c2a06f'; ctx.fillRect(0,gy,W,8);
    ctx.fillStyle='#9bd98a';
    const off=(time*speed)%24;
    for(let x=-off; x<W; x+=24){
      ctx.beginPath(); ctx.moveTo(x,gy); ctx.lineTo(x+6,gy-9); ctx.lineTo(x+12,gy); ctx.fill();
    }
  }

  function drawGhost(){
    const g=ghost;
    ctx.save(); ctx.translate(g.x, g.y);
    const bob=Math.sin(time*4)*2;
    // glow
    ctx.fillStyle='rgba(200,220,255,.22)';
    ctx.beginPath(); ctx.arc(0,bob,30,0,7); ctx.fill();

    // flowing cloth body: domed head, a trailing tail to the LEFT (since we move
    // right), and an animated wavy hem along the bottom.
    ctx.fillStyle='rgba(245,250,255,.93)';
    ctx.beginPath();
    // head dome (slightly forward-leaning to the right)
    ctx.arc(2,bob-2,19,Math.PI*0.95,Math.PI*1.95);
    // forward (right) side down
    ctx.quadraticCurveTo(22,bob+4, 20, bob+16);
    // animated wavy hem from right to left
    const baseY=bob+16, n=5, x0=20, x1=-26;
    for(let i=0;i<n;i++){
      const fx=x0 + (x1-x0)*((i+1)/n);
      const px=x0 + (x1-x0)*((i+0.5)/n);
      const dip = baseY + 9 + Math.sin(time*7 + i*1.1)*5;
      ctx.quadraticCurveTo(px, dip, fx, baseY + Math.sin(time*7+i)*2);
    }
    // trailing tail wisp on the left, waving
    const tailY = bob - 2 + Math.sin(time*5)*4;
    ctx.quadraticCurveTo(-34, baseY-2, -30, tailY);
    ctx.quadraticCurveTo(-20, bob-14, -8, bob-16);
    ctx.closePath(); ctx.fill();

    // face looking FORWARD (toward the right) — eyes set right of center
    ctx.fillStyle='#5a6b8c';
    ctx.beginPath(); ctx.ellipse(4,bob-4,3,4.5,0,0,7); ctx.ellipse(13,bob-4,3,4.5,0,0,7); ctx.fill();
    // pupils glance forward
    ctx.fillStyle='#36425c';
    ctx.beginPath(); ctx.arc(5,bob-4,1.3,0,7); ctx.arc(14,bob-4,1.3,0,7); ctx.fill();
    // little mouth
    ctx.fillStyle='#5a6b8c';
    ctx.beginPath(); ctx.arc(9,bob+4,2.5,0,Math.PI); ctx.fill();
    // rosy cheeks
    ctx.fillStyle='rgba(255,170,180,.4)';
    ctx.beginPath(); ctx.arc(2,bob+2,3,0,7); ctx.arc(16,bob+2,3,0,7); ctx.fill();
    ctx.restore();
  }

  function drawString(){
    // wavy ghostly string from ghost down to the baby elephant
    const g=ghost, e=ellie;
    ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(g.x, g.y+14);
    const mx=(g.x+e.x)/2 + Math.sin(time*5)*4, my=(g.y+e.y)/2;
    ctx.quadraticCurveTo(mx, my, e.x, e.y-e.r*0.6);
    ctx.stroke();
  }

  function drawEllie(){
    // the baby elephant dangling on the string (smaller, normal ears, tilts with swing)
    const e=ellie;
    let aura=null;
    if(powers.invincible>0) aura='#ffd34d';
    else if(powers.shield) aura='#9be88a';
    else if(powers.tiny>0) aura='#7fd1ff';
    else if(powers.slowmo>0) aura='#b59cff';
    if(aura){
      ctx.save(); ctx.translate(e.x,e.y);
      ctx.globalAlpha=0.35+Math.sin(time*8)*0.12;
      ctx.fillStyle=aura;
      ctx.beginPath(); ctx.arc(0,0,e.r+12,0,7); ctx.fill();
      ctx.restore();
    }
    ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.rot);
    const s=0.8*(e.r/(e.baseR||22)); ctx.scale(s,s);
    const draw=CHARACTERS[charKey].draw;
    if(draw==='elephant') drawCharElephant(e);
    else if(draw==='teddy') drawCharTeddy(e);
    else if(draw==='hen') drawCharHen(e);
    else if(draw==='pigeon') drawCharPigeon(e);
    else if(draw==='eagle') drawCharEagle(e);
    ctx.restore();
  }

  function drawCharElephant(e){
    const earBeat=Math.sin(time*5)*0.12;
    ctx.save(); ctx.translate(-2,-4); ctx.rotate(-0.35-earBeat);
    ctx.fillStyle='#aecbe4'; ctx.beginPath(); ctx.ellipse(-15,2,15,19,0.2,0,7); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#c9dcee'; ctx.beginPath(); ctx.ellipse(0,4,23,21,0,0,7); ctx.fill();
    ctx.fillStyle='#cfe0f0'; ctx.beginPath(); ctx.arc(8,-6,18,0,7); ctx.fill();
    ctx.strokeStyle='#cfe0f0'; ctx.lineWidth=10; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(18,-12); ctx.quadraticCurveTo(30,-20,24,-30); ctx.stroke();
    ctx.save(); ctx.translate(6,-4); ctx.rotate(0.3+earBeat);
    ctx.fillStyle='#bcd4e8'; ctx.beginPath(); ctx.ellipse(-12,2,15,19,-0.15,0,7); ctx.fill();
    ctx.fillStyle='#d9b6c9'; ctx.beginPath(); ctx.ellipse(-12,3,8,11,-0.15,0,7); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(13,-9,5,0,7); ctx.fill();
    ctx.fillStyle='#3a3340'; ctx.beginPath(); ctx.arc(14,-8,2.6,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(15,-9.5,1,0,7); ctx.fill();
    ctx.fillStyle='rgba(240,160,170,.55)'; ctx.beginPath(); ctx.arc(4,2,4.5,0,7); ctx.fill();
    ctx.fillStyle='#b6cfe6'; ctx.beginPath(); ctx.ellipse(-8,22,6,4,0,0,7); ctx.ellipse(8,22,6,4,0,0,7); ctx.fill();
  }

  function drawCharTeddy(e){
    const earBeat=Math.sin(time*5)*0.06;
    // ears
    ctx.fillStyle='#a9794f';
    ctx.beginPath(); ctx.arc(-14,-16,8,0,7); ctx.arc(14,-16,8,0,7); ctx.fill();
    ctx.fillStyle='#c79a6a';
    ctx.beginPath(); ctx.arc(-14,-16,4,0,7); ctx.arc(14,-16,4,0,7); ctx.fill();
    // body + head
    ctx.fillStyle='#b9824f'; ctx.beginPath(); ctx.ellipse(0,8,20,19,0,0,7); ctx.fill();
    ctx.fillStyle='#c99a64'; ctx.beginPath(); ctx.arc(0,-6,18,0,7); ctx.fill();
    // muzzle
    ctx.fillStyle='#ecd6b2'; ctx.beginPath(); ctx.ellipse(0,0,9,7,0,0,7); ctx.fill();
    ctx.fillStyle='#5a3a22'; ctx.beginPath(); ctx.ellipse(0,-3,3,2.2,0,0,7); ctx.fill();
    // eyes
    ctx.fillStyle='#3a2418'; ctx.beginPath(); ctx.arc(-7,-9,2.4,0,7); ctx.arc(7,-9,2.4,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-6,-10,0.9,0,7); ctx.arc(8,-10,0.9,0,7); ctx.fill();
    // arms/paws
    ctx.fillStyle='#a9794f'; ctx.beginPath(); ctx.arc(-18,6,6,0,7); ctx.arc(18,6,6,0,7); ctx.fill();
    ctx.fillStyle='rgba(240,160,170,.4)'; ctx.beginPath(); ctx.arc(-9,2,3.5,0,7); ctx.arc(9,2,3.5,0,7); ctx.fill();
  }

  function wingFlap(e){ // returns wing angle for flyers, based on flap impulse + idle beat
    return Math.sin(time*16)*0.5 + (e.flap||0)*0.9;
  }

  function drawCharHen(e){
    const w=wingFlap(e);
    // body (plump)
    ctx.fillStyle='#f3f0ea'; ctx.beginPath(); ctx.ellipse(0,4,22,18,0,0,7); ctx.fill();
    // tail
    ctx.fillStyle='#d8d2c6'; ctx.beginPath(); ctx.moveTo(-18,-2); ctx.quadraticCurveTo(-34,-14,-26,4); ctx.quadraticCurveTo(-30,10,-16,8); ctx.fill();
    // wing
    ctx.save(); ctx.translate(-2,2); ctx.rotate(-0.2+w*0.4);
    ctx.fillStyle='#e3ddd0'; ctx.beginPath(); ctx.ellipse(0,0,15,10,0,0,7); ctx.fill(); ctx.restore();
    // head
    ctx.fillStyle='#f7f4ee'; ctx.beginPath(); ctx.arc(14,-12,12,0,7); ctx.fill();
    // comb
    ctx.fillStyle='#e0584f'; ctx.beginPath(); ctx.arc(12,-22,3,0,7); ctx.arc(17,-23,3,0,7); ctx.arc(22,-21,3,0,7); ctx.fill();
    // beak + wattle
    ctx.fillStyle='#f2a93b'; ctx.beginPath(); ctx.moveTo(24,-12); ctx.lineTo(34,-9); ctx.lineTo(24,-6); ctx.fill();
    ctx.fillStyle='#e0584f'; ctx.beginPath(); ctx.ellipse(22,-3,3,5,0,0,7); ctx.fill();
    // eye
    ctx.fillStyle='#2a2420'; ctx.beginPath(); ctx.arc(17,-13,2.4,0,7); ctx.fill();
  }

  function drawCharPigeon(e){
    const w=wingFlap(e);
    ctx.fillStyle='#9fb0c4'; ctx.beginPath(); ctx.ellipse(0,4,21,16,0,0,7); ctx.fill();
    ctx.fillStyle='#7d90a8'; ctx.beginPath(); ctx.moveTo(-16,0); ctx.quadraticCurveTo(-30,-2,-28,8); ctx.quadraticCurveTo(-24,12,-14,8); ctx.fill();
    ctx.save(); ctx.translate(-2,2); ctx.rotate(-0.25+w*0.5);
    ctx.fillStyle='#8ba0b8'; ctx.beginPath(); ctx.ellipse(0,0,16,9,0,0,7); ctx.fill(); ctx.restore();
    ctx.fillStyle='#aebed0'; ctx.beginPath(); ctx.arc(15,-10,11,0,7); ctx.fill();
    // iridescent neck
    ctx.fillStyle='rgba(120,200,170,.5)'; ctx.beginPath(); ctx.ellipse(8,-2,7,8,0,0,7); ctx.fill();
    ctx.fillStyle='#e8a23b'; ctx.beginPath(); ctx.moveTo(25,-10); ctx.lineTo(33,-8); ctx.lineTo(25,-6); ctx.fill();
    ctx.fillStyle='#2a2420'; ctx.beginPath(); ctx.arc(18,-11,2.3,0,7); ctx.fill();
    ctx.fillStyle='#e7654f'; ctx.beginPath(); ctx.arc(18,-11,3.4,0,7); ctx.fill();
    ctx.fillStyle='#2a2420'; ctx.beginPath(); ctx.arc(18,-11,2,0,7); ctx.fill();
  }

  function drawCharEagle(e){
    const w=wingFlap(e);
    // big wings spread
    ctx.fillStyle='#6b4a2f';
    ctx.save(); ctx.translate(-4,0); ctx.rotate(-0.4+w*0.6);
    ctx.beginPath(); ctx.ellipse(-14,0,22,11,0,0,7); ctx.fill(); ctx.restore();
    // body
    ctx.fillStyle='#7a5638'; ctx.beginPath(); ctx.ellipse(0,4,20,16,0,0,7); ctx.fill();
    // tail
    ctx.fillStyle='#e9e4da'; ctx.beginPath(); ctx.moveTo(-16,2); ctx.lineTo(-30,2); ctx.lineTo(-16,10); ctx.fill();
    // white head
    ctx.fillStyle='#f4f1ea'; ctx.beginPath(); ctx.arc(15,-10,12,0,7); ctx.fill();
    // beak
    ctx.fillStyle='#f2b53b'; ctx.beginPath(); ctx.moveTo(24,-12); ctx.quadraticCurveTo(36,-10,26,-4); ctx.lineTo(24,-7); ctx.fill();
    // eye + brow (fierce)
    ctx.fillStyle='#caa23a'; ctx.beginPath(); ctx.arc(17,-12,3,0,7); ctx.fill();
    ctx.fillStyle='#2a2420'; ctx.beginPath(); ctx.arc(18,-12,1.6,0,7); ctx.fill();
    ctx.strokeStyle='#caa23a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(12,-15); ctx.lineTo(20,-14); ctx.stroke();
    // near wing
    ctx.fillStyle='#8a623f';
    ctx.save(); ctx.translate(0,2); ctx.rotate(0.3-w*0.5);
    ctx.beginPath(); ctx.ellipse(-6,2,20,10,0,0,7); ctx.fill(); ctx.restore();
  }

  // ===================== COLLISION =====================
  function circleHitsColumns(o, topSolidTo, botSolidFrom){
    const e=ellie;
    // Horizontal overlap with the stalk, using a snug body half-width and an
    // inset solid span so the stalk's very edges don't act as an invisible wall
    // as it scrolls past Ellie.
    const half = e.r*0.6;
    const left = o.x + 4;
    const right = o.x + PIPE_W - 4;
    if(e.x + half > left && e.x - half < right){
      if(topSolidTo!=null && e.y - e.r*0.78 < topSolidTo) return true;
      if(botSolidFrom!=null && e.y + e.r*0.78 > botSolidFrom) return true;
    }
    return false;
  }
  function collides(){
    const e=ellie;
    if(e.y + e.r > H-GROUND_H){ e.y=H-GROUND_H-e.r; return true; }
    if(e.y - e.r < 0) return true;
    for(const o of obstacles){
      if(o.type==='bamboo' || o.type==='ants'){
        if(circleHitsColumns(o, o.gapY, o.gapY+GAP)) return true;
      } else if(o.type==='ladybugs'){
        // bottom column solid; top formed by bugs (check each bug circle) ; also bottom bugs
        if(circleHitsColumns(o, o.gapY, o.gapY+GAP)) return true;
      } else if(o.type==='spider'){
        // top + bottom tree branches are solid (like logs) ...
        if(circleHitsColumns(o, o.gapY, o.gapY+GAP)) return true;
        // ... plus the spider swinging side-to-side on its web
        const sx=o.x+PIPE_W/2 + o.spider.sx, sy=o.spider.sy+6;
        const dx=e.x-sx, dy=e.y-sy;
        const hitDist = e.r*0.5 + o.spider.r*0.65;
        if(dx*dx+dy*dy < hitDist*hitDist) return true;
      }
    }
    return false;
  }

  // ===================== UPDATE =====================
  function update(dt){
    time += dt;
    recycleScenery(dt);

    if(state==='playing'){
      speed += 6*dt; // gentle ramp
      const g=ghost, e=ellie;
      // effective scroll speed (slow-mo halves it)
      const spd = speed * (powers.slowmo>0 ? 0.5 : 1);
      // tiny power shrinks the character's collision + draw size
      e.r = (powers.tiny>0 ? e.baseR*0.55 : e.baseR);

      if(e.carried){
        // --- ghost: float feel, kept on-screen, intangible ---
        const prevGY = g.y;
        g.vy += GRAV*dt;
        g.y  += g.vy*dt;
        g.flap = Math.max(0, g.flap - dt*4);
        if(g.y < 30){ g.y=30; if(g.vy<0) g.vy=0; }
        if(g.y > H-GROUND_H-30){ g.y=H-GROUND_H-30; if(g.vy>0) g.vy=0; }
        const ghostAY = (g.y - prevGY)/dt;
        // --- character: pendulum bob hanging from the ghost ---
        const Lp = e.string;
        const grav = 26;
        const drive = -ghostAY * 0.010;
        const aacc = -(grav/Lp)*Math.sin(e.a) + drive*Math.cos(e.a);
        e.av += aacc*dt;
        e.av *= (1 - 1.4*dt);
        e.av = Math.max(-6, Math.min(6, e.av));
        e.a  += e.av*dt;
        const maxA = 1.15;
        if(e.a> maxA){ e.a= maxA; e.av*=-0.3; }
        if(e.a<-maxA){ e.a=-maxA; e.av*=-0.3; }
        e.x = g.x + Math.sin(e.a)*Lp;
        e.y = g.y + Math.cos(e.a)*Lp;
        e.rot = e.a*0.5;
      } else {
        // --- flyer: classic flap with per-character gravity ---
        const ch=CHARACTERS[charKey];
        e.vy += (ch.grav||GRAV)*dt;
        e.y  += e.vy*dt;
        e.rot = Math.max(-0.5, Math.min(1.1, e.vy*0.0011));
        e.flap = Math.max(0, e.flap - dt*4);
      }

      obstacles.forEach(o=>{
        o.x -= spd*dt;
        if(o.type==='spider'){
          const s=o.spider;
          s.sx = Math.sin(time*s.freq*2*Math.PI + s.phase) * s.swing;
          s.sy = o.gapY + s.hangLen;
        }
        if(!o.scored && o.x + PIPE_W < e.x){
          o.scored=true; score++; hud.textContent=score;
          Audio.play('score');
          Audio.play(o.type);
        }
      });
      if(obstacles.length && obstacles[0].x < -PIPE_W-40){
        obstacles.shift();
        const last=obstacles[obstacles.length-1].x;
        addObstacle(last + SPACING);
        maybeSpawnPickup(last);
      }

      // move & collect pickups
      const e2=ellie;
      pickups.forEach(p=>{
        p.x -= spd*dt;
        p.bobY = p.y + Math.sin(time*3 + p.phase)*7;
        if(!p.taken){
          const dx=e2.x-p.x, dy=e2.y-p.bobY;
          if(dx*dx+dy*dy < (e2.r+p.r)*(e2.r+p.r)){
            p.taken=true;
            applyPower(p.type);
            Audio.play('score');
          }
        }
      });
      pickups = pickups.filter(p=> !p.taken && p.x > -40);

      // tick down power timers
      if(powers.invincible>0) powers.invincible=Math.max(0,powers.invincible-dt);
      if(powers.tiny>0)       powers.tiny=Math.max(0,powers.tiny-dt);
      if(powers.slowmo>0)     powers.slowmo=Math.max(0,powers.slowmo-dt);
      if(powers.invincible<=0 && collides()){
        if(powers.shield){
          powers.shield=false;
          powers.invincible=Math.max(powers.invincible,0.8);
          Audio.play('bamboo');
        } else {
          gameOver();
        }
      }
    } else if(state==='over'){
      // character tumbles down; if it was carried, the ghost drifts up sadly
      const e=ellie;
      e.fallVy = (e.fallVy||0) + GRAV*dt;
      if(e.y+e.r < H-GROUND_H){ e.y += e.fallVy*dt; e.rot += dt*3; }
      if(ghost) ghost.y -= 20*dt;
    }
  }

  function drawPowerHUD(){
    if(state!=='playing') return;
    const active=[];
    if(powers.invincible>0) active.push(['invincible',powers.invincible]);
    if(powers.tiny>0) active.push(['tiny',powers.tiny]);
    if(powers.slowmo>0) active.push(['slowmo',powers.slowmo]);
    if(powers.shield) active.push(['shield',null]);
    let x=14, y=64;
    active.forEach(([type,tleft])=>{
      const info=POWER_INFO[type];
      ctx.fillStyle=info.color;
      ctx.beginPath(); ctx.arc(x+12,y+12,12,0,7); ctx.fill();
      ctx.lineWidth=2.5; ctx.strokeStyle=info.ring; ctx.stroke();
      // timer ring
      if(tleft!=null){
        ctx.strokeStyle='#fff'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(x+12,y+12,12,-Math.PI/2, -Math.PI/2 + (tleft/3)*2*Math.PI); ctx.stroke();
      }
      y+=30;
    });
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    drawBackground();
    // when on the main menu / submenus (and no run in progress), show a calm backdrop only
    if(state==='menu'){ drawGround(); return; }
    obstacles.forEach(drawObstacle);
    drawPickups();
    drawGround();
    const carried = ellie && ellie.carried;
    if(carried && state!=='over'){ drawString(); }
    drawEllie();
    if(carried && state!=='over'){ drawGhost(); }
    drawPowerHUD();
  }

  // ===================== MAIN LOOP (fixed-step accumulator) =====================
  // A fixed simulation step makes physics & collision identical on 60Hz, 120Hz
  // (iPhone ProMotion), and during frame hitches. A single slow frame is broken
  // into several small steps instead of one big jump, so Ellie can never
  // "teleport" through the edge of a gap — which was the iPhone-only bug.
  const STEP = 1/120;            // simulate at a steady 120 steps/sec
  let acc = 0;
  let lastT = performance.now();
  function loop(now){
    let frameDt=(now-lastT)/1000; lastT=now;
    if(frameDt>0.25) frameDt=0.25;     // after a long pause, don't fast-forward forever
    acc += frameDt;
    let steps=0;
    while(acc >= STEP && steps < 60){   // cap steps to stay responsive
      update(STEP);
      acc -= STEP;
      steps++;
    }
    render();
    requestAnimationFrame(loop);
  }
  // start on the main menu
  makeScenery();                 // backdrop for the menu
  speed = BASE_SPEED;            // gentle drift on the menu backdrop
  time = 0;
  best = Store.get('best_'+charKey, 0);
  refreshMenu();
  showScreen('menu');
  requestAnimationFrame(loop);
})();
</script>
</body>
